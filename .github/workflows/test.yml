name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests
      - run: python3 examples/pt100-v4/analyze.py
      - run: cc -std=c11 -Wall -Wextra -Werror examples/pt100-v4/pt100.c examples/pt100-v4/test_pt100.c -lm -o /tmp/pt100-test && /tmp/pt100-test
      - run: sudo apt-get update && sudo apt-get install -y gcc-avr avr-libc binutils-avr ngspice
      - run: python3 examples/pt100-v5/compile.py
      - run: node examples/pt100-v5/verify-avr.mjs
      - run: python3 examples/pt100-v5/protection.py --output /tmp/pt100-protection

  portable-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/doctor.test.mjs tests/mcp.test.mjs tests/model.test.mjs tests/protocol.test.mjs
      - run: npm pack --dry-run --ignore-scripts
