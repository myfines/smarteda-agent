name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests
      - run: python3 examples/pt100-v4/analyze.py
      - run: cc -std=c11 -Wall -Wextra -Werror examples/pt100-v4/pt100.c examples/pt100-v4/test_pt100.c -lm -o /tmp/pt100-test && /tmp/pt100-test
